# ┌─────────────────────────────────────────────────────────────────┐
# │  wbox-mcp — config.yaml reference                              │
# │  Copy this file, uncomment what you need, and adjust values.   │
# └─────────────────────────────────────────────────────────────────┘

# Instance name — used for state files, MCP registration, socket naming.
name: my-wbox

# ── Compositor ─────────────────────────────────────────────────────
#
# Which nested Wayland compositor to run (Linux), or win32 on Windows.
#
#   labwc   — (default) wlroots-based stacking WM. Resizable, movable window.
#             Supports hybrid/wayland input backends (wlroots protocols).
#   weston  — Reference compositor. Resizable window (x11 backend).
#             Only supports x11 input backend (no wlroots protocols).
#   cage    — Kiosk compositor. Fixed-size fullscreen, no resize/move.
#             Supports hybrid/wayland input backends (wlroots-based).
#
#   win32   — Windows (auto-detected there). No compositor: the app is
#             driven through Win32 APIs. See the Windows section below.
#
compositor: labwc
# compositor: weston
# compositor: cage
# compositor: win32

# ── Windows (compositor: win32) ────────────────────────────────────
#
# title_hint: substring of the app's window title, as localized (Win11
# Notepad is "Bloc-notes" on a French system). Many apps hand their
# window to another process, so the hint is what finds it.
#
# sandbox: run the app in Windows Sandbox, a throwaway Windows of its
# own, instead of on your desktop: the pointer, keyboard and clipboard
# wbox uses are the sandbox's. Without it there is no isolation — most
# clicks move your real cursor and take focus. Needs Windows 10/11 Pro,
# Enterprise or Education (setup.ps1 turns the feature on). The sandbox
# is a fresh Windows: the app must come from a folder you mount.
#
# With sandbox:, "headless: true" minimizes the sandbox's window.
# Without it, headless is ignored — as are screen, input_backend,
# keyboard_layout, undecorate, clipboard_bridge and the weston options.
#
# title_hint: "My App"
# sandbox:
#   mounts:                 # host is relative to this file
#     - {host: ./build, guest: 'C:\app', readonly: true}
#   networking: false       # true: the app gets a network (through the host)
#   vgpu: true              # false: software rendering (WARP)
#   memory_mb: 4096         # default: Windows'
#   keep: false             # true: kill/stop leave the sandbox up, and the
#                           # next launch reuses it, with no boot
#   boot_timeout: 180       # seconds to boot and answer
# timeouts:
#   window_discovery: 10    # wait for the app's window to appear
#   edit_control: 3         # wait for the text-input control
#   app_render: 3           # wait for the app to draw
# app:
#   command: 'C:\app\myapp.exe'

# Screen size (WxH) — initial size of the nested compositor window.
screen: "1280x800"

# ── Headless (offscreen) mode ──────────────────────────────────────
#
# Run the nested compositor on an offscreen output: nothing appears on
# the host desktop, while screenshots, clicks and keyboard injection all
# keep working normally. Useful for test suites and unattended runs.
#
# Works with all three compositors. labwc and cage use the wlroots
# headless backend; weston uses its own, forced onto the pixman software
# renderer (its default noop renderer draws nothing, which would leave
# screenshots hanging forever) — so weston headless is a bit slower.
#
# "quiet" is accepted as an alias for the same option.
#
headless: false

# ── Clipboard bridge (labwc only) ──────────────────────────────────
#
# labwc keeps the sandbox clipboard in sync with your desktop, both
# ways, so you can copy-paste between them.
#
# SECURITY: while enabled, the sandboxed app can read everything you
# copy on your desktop — passwords included. Set it to false to keep
# the sandbox clipboard isolated; clipboard_read/clipboard_write keep
# working, they just no longer reach your desktop.
#
clipboard_bridge: true

# ── Weston-specific options (ignored by labwc/cage) ────────────────
#
# weston_shell: kiosk or desktop
#   kiosk   — no panel, no window decorations inside
#   desktop — full desktop shell with panel
#
# weston_backend: wayland or x11
#   wayland — weston runs as a Wayland client (recommended)
#   x11     — weston runs as an X11 client
#
# weston_shell: kiosk
# weston_backend: x11

# ── Input backend ──────────────────────────────────────────────────
#
# Controls how keyboard, mouse, and clipboard input is injected
# into the nested compositor.
#
# Presets (string):
#   hybrid  — (default) wbox-keyboard + wbox-pointer + xclip/xsel clipboard
#             Best combo: native Wayland input, no interference with the
#             user's host desktop. Pair with keyboard_layout: us.
#             Requires wlroots compositor (labwc, cage).
#   x11     — xdotool for everything + xclip/xsel clipboard.
#             Works with all compositors. Needs Xwayland.
#   wayland — wbox-keyboard + wbox-pointer + wl-clipboard.
#             Fully Wayland-native, no X11 tooling needed.
#             Requires wlroots compositor (labwc, cage).
#
# Custom (dict) — mix and match per function:
#   keyboard:  xdotool | wtype | wbox-keyboard
#   mouse:     xdotool | ydotool | wbox-pointer
#   clipboard: x11     | wayland
#   Missing keys are filled from the "x11" preset defaults.
#
# Note on wbox-keyboard vs wtype: wlroots compositors force the seat keymap
# onto every keyboard, which breaks wtype's embedded keymap (garbled text).
# wbox-keyboard sends US-layout keycodes instead — set keyboard_layout: us.
#
input_backend: hybrid
# input_backend: x11
# input_backend: wayland
# input_backend:
#   keyboard: wbox-keyboard  # wbox-keyboard (Wayland native), wtype, or xdotool (X11)
#   mouse: xdotool           # xdotool (X11, isolated), wbox-pointer, or ydotool (uinput, NOT isolated)
#   clipboard: wayland       # wayland (wl-copy/wl-paste) or x11 (xclip/xsel)

# ── Logging ────────────────────────────────────────────────────────
log:
  dir: ./log
  # level: debug | info | warning | error
  level: info

# ── Screenshots ────────────────────────────────────────────────────
screenshot_dir: ./screenshots

# ── Timeouts (seconds) ─────────────────────────────────────────────
# timeouts:
#   wayland_display: 10   # wait for compositor's Wayland socket
#   xwayland_display: 15  # wait for Xwayland display
#   app_render: 3         # wait after app launch for initial render
#   stop: 10              # graceful SIGTERM timeout before SIGKILL

# ── Application ────────────────────────────────────────────────────
app:
  command: ""             # e.g. "xterm", "soffice --writer", "firefox"
  env: {}                 # environment variables passed to the app
  # env:
  #   SAL_USE_VCLPLUGIN: gtk3
  #   MY_VAR: value

  # Scripts to run before launching the app (in order).
  # pre_launch:
  # - python3 scripts/setup.py
  # - ./scripts/prepare.sh

# ── Script timeout ─────────────────────────────────────────────────
# Global timeout for custom script tools (seconds). Default: 120.
# Can be overridden per-tool with "timeout:" in the tool definition.
# tool_timeout: 120

# ── Custom tools ───────────────────────────────────────────────────
#
# Each key becomes an MCP tool. The script runs with DISPLAY and
# WAYLAND_DISPLAY set to the compositor's internal displays.
#
# tools:
#   my_tool:
#     script: ./scripts/my_tool.sh
#     description: What this tool does
#     timeout: 30                      # optional per-tool timeout (seconds)
