name: integration

# Advisory for now — see the job's continue-on-error. Nested wlroots
# compositors on a GPU-less runner are new ground for this project; a badge
# nobody trusts is worse than no badge. Flip `continue-on-error` off once the
# job has gone green a few times in a row.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    name: labwc + hybrid (headless)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    env:
      # wlroots' headless backend still needs a renderer, and the runner has
      # no GPU and no DRM device. Without this, labwc reaches for GLES2 and
      # fails the same way weston did on its noop renderer (see the 0.6.0
      # entry: "weston captured nothing in headless mode").
      WLR_RENDERER: pixman
      # Keep the suite offscreen. This is the default, but being explicit
      # documents that CI never wants a visible window.
      WBOX_TEST_VISIBLE: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Heads-up for the first red run: ubuntu-latest (24.04) ships labwc
      # 0.7.1, while this project is developed against 0.9.6. The decoration
      # assertions in TestDecorations were written against 0.9.6's server-side
      # decoration placement. If they fail here and pass locally, suspect the
      # version gap before suspecting a regression — and pin or backport
      # rather than loosening the assertion.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            labwc \
            wlr-randr \
            grim \
            xwayland \
            wlrctl \
            ffmpeg \
            xdotool \
            xclip \
            x11-utils \
            x11-xkb-utils \
            python3-tk \
            xvfb \
            pipewire \
            pipewire-pulse \
            pipewire-alsa \
            wireplumber \
            pulseaudio-utils \
            alsa-utils \
            mutter \
            dbus \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-pipewire \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0
        # The mutter rows since #4851: TestMutter runs mutter headless and
        # drives a GTK 4 app (gtk_dummy, system python3 + PyGObject, and gi-cairo:
        # without it the app's windows map but draw nothing); jeepney
        # comes with the [mutter] extra below.
        # The audio tools since #4702: headless sessions start their own
        # audio server (audio: null), and TestAudio plays through Pulse and
        # ALSA to prove the sound stays inside. A runner without them must
        # fail those tests, not skip them.
        # wlrctl earns its place since #3205: focus_window still shells out to
        # it, and TestWindowState exercises that. list_windows no longer does
        # — it reads the foreign-toplevel protocol directly — so converting
        # focus_window the same way would drop this dependency again.
        #
        # Deliberately NOT installed:
        #   wtype   — optional since the wbox-keyboard backend landed.
        #   ydotool — injects into the host seat, never usable for nested input.
        #   weston, cage — not needed while this job runs labwc only.

      - name: Install wbox
        run: pip install -e ".[test,mutter]"


      - name: Report the toolchain
        # A missing tool makes fixtures skip rather than fail, which would
        # read as a pass. Print what's actually present so a green run can be
        # checked against it.
        run: |
          labwc --version || true
          for t in wlr-randr wlrctl grim ffmpeg xdotool xclip xprop setxkbmap Xvfb Xwayland; do
            printf '%-12s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          mutter --version || true
          gst-inspect-1.0 pipewiresrc | head -3 || true
          python -m pytest --version

      - name: Integration suite — labwc + hybrid
        run: |
          .github/scripts/run-suite.sh

      # Platform-free: the Windows Sandbox mode's channel and config.
      - name: Sandbox channel
        run: python -m pytest tests/test_sandbox_channel.py -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wbox-logs
          path: tests/crash-dummy/log/
          retention-days: 7
          if-no-files-found: ignore

  windows:
    name: win32 (desktop) + sandbox channel
    runs-on: windows-latest
    # Advisory, as the job above: the runner's desktop is new ground.
    continue-on-error: true
    timeout-minutes: 20

    env:
      # The runner's desktop is nobody's: the tests may move its pointer.
      WBOX_TEST_DESKTOP: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wbox
        run: pip install -e ".[test]"

      # record's assemble: on the bench, not behind a skip (as on Linux).
      - name: Install ffmpeg
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1

      # The Windows Sandbox mode's plumbing (the channel, the .wsb, the
      # forwarded calls) runs anywhere. The sandbox itself does not: a hosted
      # runner has no Windows Sandbox, so test_windows.py's sandbox tests
      # skip here and run on a developer's machine.
      - name: Sandbox channel and the win32 backend on the desktop
        run: python -m pytest tests/test_sandbox_channel.py tests/test_windows.py tests/test_windows_density.py tests/test_windows_resize.py -v -rs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wbox-windows-logs
          path: ${{ runner.temp }}/wbox_*
          retention-days: 7
          if-no-files-found: ignore
