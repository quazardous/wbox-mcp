[project]
name = "wbox-mcp"
dynamic = ["version"]
description = "Wayland/X11 box — nested compositor MCP server for GUI automation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Berlioz"}]
keywords = ["mcp", "gui-automation", "wayland", "labwc", "headless", "testing",
            "screenshot", "gamepad", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment :: Window Managers",
]
dependencies = [
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The integration suite's runner. Declared here rather than installed ad hoc in
# CI, so `pip install -e ".[test]"` is the one documented way to get a working
# test environment — contributor or runner alike.
test = ["pytest>=8"]
# The mutter backend talks to mutter over D-Bus (pure Python, no libdbus).
mutter = ["jeepney>=0.8"]
# Scenarios compare captures pixel by pixel (wbox/imaging.py).
scenario = ["numpy>=1.24", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/quazardous/wbox-mcp"
Documentation = "https://github.com/quazardous/wbox-mcp/blob/main/docs/usage.md"
Changelog = "https://github.com/quazardous/wbox-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/quazardous/wbox-mcp/issues"

[project.scripts]
wboxr = "wbox.cli.registry:main"
wbox-mcp = "wbox.cli.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "wbox.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
